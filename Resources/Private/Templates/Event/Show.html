<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="content">
    <h2>
    <f:if condition="{event.url}">
        <f:then>
            <a href="{event.url}" target="_blank">{event.name}</a>
        </f:then>
        <f:else>
            {event.name}
        </f:else>
    </f:if>
    </h2>
    <f:if condition="{event.subtitle}">
        <h3 class="subtitle">{event.subtitle}</h3>
    </f:if>

    <f:format.html>{event.description}</f:format.html>
        <f:render partial="Event/MainEventImage" arguments="{event: event, settings: settings}" />
    <f:if condition="{settings.listPid}">
    <p class="row-item-back">
        <f:link.page pageUid="{settings.listPid}">
            <f:translate key="backToList"/>
        </f:link.page>
    </p>
    </f:if>
</f:section>
</html>
