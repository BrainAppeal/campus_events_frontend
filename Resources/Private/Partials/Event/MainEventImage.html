<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{event.eventImages -> f:count()} > 0">
    <div class="d-flex justify-content-center my-6">
        <f:for each="{event.eventImages}" as="eventImage">
            <f:if condition="{eventImage.imageFile}">
                <f:image image="{eventImage.imageFile}" width="992" />
            </f:if>
        </f:for>
    </div>
</f:if>
</html>
